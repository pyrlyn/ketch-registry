# The token CLI as a package manager package.
#
# Inference from github:pyrlyn/rtok already works; this file is what
# `the package manager push` sends to the registry and what docs / `the package manager info` show.
# Schema: pyrlyn/ketch docs/MANIFESTS.md.

name = "rtok"
source = "github:pyrlyn/rtok"
description = "Reduce the context AI coding agents must carry"
homepage = "https://github.com/pyrlyn/rtok"

# Only the CLI. The release zip also ships `plugins/` for `the token CLI agent setup`;
# without an explicit `bin`, Windows auto-discovery treats
# `plugins/cursor/scripts/mcp.cmd` (and `mcp.sh`) as installable binaries and
# copies them into `~/.pkgmgr/bin`, which then breaks upgrades.
# Path glob matches the token CLI (Unix) and `the token CLI.exe` (Windows).
bin = [{ path = "rtok*", name = "rtok" }]

# Prefer platform archives dist publishes; skip self-updater sidecars and
# the source tarball so scoring cannot pick those by mistake.
[asset]
include = [
  "*-apple-darwin.tar.xz",
  "*-linux-gnu.tar.xz",
  "*-pc-windows-msvc.zip",
]
exclude = ["*-update*", "source.tar.gz"]
