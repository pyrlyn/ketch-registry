# The package manager, as a package manager package.
#
# This is the file `the package manager push` sends to the registry (pyrlyn/pkgmgr-registry,
# folder `the package manager/`), and what `the package manager self install` resolves through once it is
# there. It must stay in step with the entry in src/builtin.toml, which serves
# the same purpose for a machine that has not fetched the registry yet.
# Schema: docs/MANIFESTS.md.

name = "ketch"
source = "github:pyrlyn/ketch"
description = "Catch releases straight from GitHub"
homepage = "https://github.com/pyrlyn/ketch"
